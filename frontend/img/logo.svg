<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Deep futuristic gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" /> <!-- Navy Blue -->
      <stop offset="50%" stop-color="#3B82F6" /> <!-- Royal Blue -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Modern Cyan -->
    </linearGradient>

    <!-- Professional drop shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Background Hexagonal Shield -->
  <path d="M 64,8 
           L 112,36 
           L 112,92 
           L 64,120 
           L 16,92 
           L 16,36 
           Z" 
        fill="url(#shield-grad)" 
        filter="url(#drop-shadow)"
        stroke="rgba(255, 255, 255, 0.12)"
        stroke-width="2"
        stroke-linejoin="round" />

  <!-- 2. Stylized "O" Ring (represents the globe, circle of trust, oTender) -->
  <circle cx="64" cy="64" r="30" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="8" 
          stroke-linecap="round" 
          opacity="0.95" />

  <!-- 3. Stylized "T" Core (representing structures, engineering, and trust) -->
  <!-- Horizontal bar of the T -->
  <path d="M 44,48 L 84,48" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round" 
        opacity="0.95" />
        
  <!-- Vertical pillar of the T -->
  <path d="M 64,48 L 64,84" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round" 
        opacity="0.95" />
</svg>
