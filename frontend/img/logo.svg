<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#bg)"/>
  <!-- Letter O -->
  <circle cx="48" cy="60" r="18" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <!-- Letter T -->
  <line x1="72" y1="40" x2="100" y2="40" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <line x1="86" y1="40" x2="86" y2="80" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <!-- Accent dot -->
  <circle cx="86" cy="80" r="4" fill="#93C5FD"/>
</svg>
