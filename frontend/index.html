<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>oTender — Sistem Otomasi Dokumen & Pemantau Tender Konstruksi</title>
    <meta name="title" content="oTender — Sistem Otomasi Dokumen & Pemantau Tender Konstruksi">
    <meta name="description" content="oTender adalah platform manajemen tender konstruksi terbaik untuk memantau pengumuman lelang LPSE, otomatisasi pembuatan dokumen penawaran, serta pengingat jadwal batas upload dokumen secara realtime.">
    <meta name="keywords" content="otender, manajemen tender, tender konstruksi, lpse, inaproc, lkpp, sbu konstruksi, jadwal lelang, dokumen penawaran, otomatisasi tender, asisten bid, tender indonesia">
    <meta name="robots" content="index, follow">
    <meta name="language" content="Indonesian">
    <meta name="author" content="oTender Developer Team">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://o-tender.com/">
    <meta property="og:title" content="oTender — Solusi Otomasi Dokumen & Pantau Tender Konstruksi">
    <meta property="og:description" content="Tingkatkan win-rate tender konstruksi Anda dengan oTender. Otomatisasi berkas penawaran, pantau jadwal lelang LPSE seluruh Indonesia secara otomatis, dan kelola pengalaman perusahaan dengan mudah.">
    <meta property="og:image" content="/img/logo.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://o-tender.com/">
    <meta property="twitter:title" content="oTender — Solusi Otomasi Dokumen & Pantau Tender Konstruksi">
    <meta property="twitter:description" content="Otomatisasi berkas penawaran, pantau jadwal lelang LPSE seluruh Indonesia secara otomatis, dan kelola data perusahaan Anda dalam satu platform cerdas.">
    <meta property="twitter:image" content="/img/logo.svg">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
    <link rel="alternate icon" type="image/png" href="/img/logo.png">
    <link rel="apple-touch-icon" href="/img/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/main.css">
</head>

<body class="light-theme" >
    <!-- ─── App Shell ──────────────────────────────────────── -->
    <div id="app" class="app-layout">

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-img">
                        <img src="/img/logo.svg" alt="oTender Logo" style="width:100%; height:100%; object-fit:contain;">
                    </div>
                    <div class="logo-text">
                        <h1>oTender</h1>
                        <span>Manajemen Tender</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <span class="nav-section-title">UTAMA</span>
                    <a href="#dashboard" class="nav-item active" data-page="dashboard">
                        <i data-lucide="layout-dashboard"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="#tender-browse" class="nav-item" data-page="tender-browse">
                        <i data-lucide="search"></i>
                        <span>Cari Tender LKPP</span>
                    </a>
                    <a href="#tender-manage" class="nav-item" data-page="tender-manage">
                        <i data-lucide="folder-kanban"></i>
                        <span>Tender Saya</span>
                    </a>
                </div>

                <div class="nav-section">
                    <span class="nav-section-title">MASTER DATA</span>
                    <a href="#company" class="nav-item" data-page="company">
                        <i data-lucide="building-2"></i>
                        <span>Perusahaan</span>
                    </a>
                    <a href="#equipment" class="nav-item" data-page="equipment">
                        <i data-lucide="truck"></i>
                        <span>Data Peralatan</span>
                    </a>
                    <a href="#personnel" class="nav-item" data-page="personnel">
                        <i data-lucide="users"></i>
                        <span>Data Personil</span>
                    </a>
                    <a href="#experience" class="nav-item" data-page="experience">
                        <i data-lucide="briefcase"></i>
                        <span>Pengalaman</span>
                    </a>
                </div>

                <div class="nav-section">
                    <span class="nav-section-title">DOKUMEN</span>
                    <a href="#documents" class="nav-item" data-page="documents">
                        <i data-lucide="file-text"></i>
                        <span>Surat</span>
                    </a>
                    <a href="#templates" class="nav-item" data-page="templates">
                        <i data-lucide="layout"></i>
                        <span>Template</span>
                    </a>
                    <a href="#dokpil" class="nav-item" data-page="dokpil">
                        <i data-lucide="file-search"></i>
                        <span>Ekstrak Dokpil</span>
                    </a>
                </div>

                <div class="nav-section">
                    <span class="nav-section-title">SISTEM</span>
                    <a href="#settings" class="nav-item" data-page="settings">
                        <i data-lucide="settings"></i>
                        <span>Pengaturan</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-footer-info">
                    <i data-lucide="info"></i>
                    <span>v1.0.0 — oTender</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Navbar -->
            <header class="topbar">
                <button id="sidebar-toggle" class="topbar-btn" aria-label="Toggle sidebar">
                    <i data-lucide="menu"></i>
                </button>
                <div class="topbar-title" id="page-title">Dashboard</div>
                <div class="topbar-actions">
                    <div class="topbar-clock" id="topbar-clock"></div>
                    <button class="topbar-btn" id="theme-toggle" aria-label="Toggle tema">
                        <i data-lucide="moon"></i>
                    </button>
                </div>
            </header>

            <!-- Page Content (dynamically rendered) -->
            <div class="page-container" id="page-container">
                <!-- Pages are injected here by the SPA router -->
                <div class="page-loading">
                    <div class="spinner"></div>
                    <p>Memuat...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close" id="modal-close" aria-label="Tutup">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- Background decoration removed for cleaner light UI -->

    <!-- Scripts -->
    <script src="/js/utils/formatter.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/pages/setup.js"></script>
    <script src="/js/pages/dashboard.js"></script>
    <script src="/js/pages/equipment.js"></script>
    <script src="/js/pages/personnel.js"></script>
    <script src="/js/pages/experience.js"></script>
    <script src="/js/pages/company.js"></script>
    <script src="/js/pages/company-detail.js"></script>
    <script src="/js/pages/documents.js"></script>
    <script src="/js/pages/templates.js"></script>
    <script src="/js/pages/dokpil.js"></script>
    <script src="/js/pages/tender-browse.js"></script>
    <script src="/js/pages/tender-manage.js"></script>
    <script src="/js/pages/tender-detail.js"></script>
    <script src="/js/pages/settings.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
