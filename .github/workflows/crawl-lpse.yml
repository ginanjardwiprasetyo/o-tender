# Crawl LPSE otomatis — runner GitHub (7GB RAM), gratis karena repo public.
# Render tetap DISABLE_CRAWLER=true (hanya SIRUP + notifikasi di sana).
# Cron pakai UTC: 23:13 UTC = 06:13 WIB, 09:07 UTC = 16:07 WIB.
# Menit bukan 00 karena antrian GitHub paling padat di awal jam (telat berjam-jam).
name: Crawl LPSE

on:
  schedule:
    - cron: '13 23 * * *' # 06:13 WIB
    - cron: '7 9 * * *'   # 16:07 WIB
  workflow_dispatch: {}

# Satu run saja — trigger saat sedang jalan otomatis membatalkan run lama (latest wins)
concurrency:
  group: crawl-lpse
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Chromium (Playwright)
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Crawl LPSE
        working-directory: backend
        run: node scripts/crawl-now.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
