# Crawl LPSE otomatis — runner GitHub (7GB RAM), gratis karena repo public.
# Cloudflare memblokir IP datacenter, jadi semua traffic di-route lewat Tailscale Exit Node
# (komputer/VPS milik sendiri) agar IP yang terlihat adalah IP residential/non-datacenter.
#
# === SETUP TAILSCALE EXIT NODE ===
# 1. Di mesin exit node (komputer/VPS kamu), jalankan:
#      sudo tailscale up --advertise-exit-node
# 2. Di Tailscale Admin Console (https://login.tailscale.com/admin/machines),
#    klik mesin -> Edit route settings -> aktifkan "Use as exit node"
# 3. Buat Auth Key: https://login.tailscale.com/admin/settings/keys
#    -> Generate auth key (Ephemeral + Reusable) -> salin hasilnya
# 4. Di repo GitHub -> Settings -> Secrets -> New repository secret:
#      Nama: TAILSCALE_AUTHKEY  | Nilai: auth key dari langkah 3
# 5. Di repo GitHub -> Settings -> Variables -> New repository variable:
#      Nama: TAILSCALE_EXIT_NODE | Nilai: hostname Tailscale mesin kamu (cek di admin console)
#
# Cron pakai UTC: 23:13 UTC = 06:13 WIB, 09:07 UTC = 16:07 WIB.
name: Crawl LPSE

on:
  schedule:
    - cron: '13 23 * * *' # 06:13 WIB
    - cron: '7 9 * * *'   # 16:07 WIB
  workflow_dispatch: {}

# Satu run saja - trigger saat sedang jalan otomatis membatalkan run lama (latest wins)
concurrency:
  group: crawl-lpse
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ${{ vars.CRAWLER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Install Chromium (macOS)
        if: runner.os == 'macOS'
        working-directory: backend
        run: npx playwright install chromium

      # Chrome asli dipakai channel:'chrome' agar sec-ch-ua tidak bocor "HeadlessChrome".
      - name: Install Google Chrome (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: backend
        run: npx playwright install --with-deps chrome

      # Challenge Cloudflare "Just a moment..." jarang lolos di mode headless -
      # jalankan Chrome non-headless lewat Xvfb (Linux saja).
      - name: Install Xvfb (browser non-headless)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      # FlareSolverr: solver Cloudflare (berjalan lokal, pakai IP exit node via Tailscale)
      - name: Start FlareSolverr
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          docker run -d \
            --name=flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest

          echo "Waiting for FlareSolverr to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/ > /dev/null 2>&1; then
              echo "FlareSolverr ready on http://localhost:8191"
              break
            fi
            sleep 1
          done

      # Tailscale: route semua traffic keluar lewat exit node (IP residential/VPS) agar lolos Cloudflare
      # Bila TAILSCALE_EXIT_NODE belum di-set, step ini di-skip dan traffic tetap pakai IP GitHub.
      - name: Connect Tailscale Exit Node
        if: runner.os == 'Linux' && vars.TAILSCALE_EXIT_NODE != ''
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --exit-node=${{ vars.TAILSCALE_EXIT_NODE }} --exit-node-allow-lan-access=true --accept-routes

      - name: Verify public IP (pastikan pakai IP exit node, bukan IP GitHub)
        if: runner.os == 'Linux'
        run: |
          echo -n "IP publik runner: "
          curl -s https://api.ipify.org
          echo ""

      - name: Crawl LPSE
        working-directory: backend
        run: |
          if command -v xvfb-run > /dev/null 2>&1; then
            xvfb-run -a node scripts/crawl-now.js
          else
            node scripts/crawl-now.js
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLARESOLVERR_URL: http://localhost:8191/v1
