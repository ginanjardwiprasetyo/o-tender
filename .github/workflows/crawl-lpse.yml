# Crawl LPSE otomatis — runner GitHub (7GB RAM), gratis karena repo public.
# Cloudflare memblokir IP datacenter, jadi semua traffic di-route lewat Tailscale Exit Node
# (komputer/VPS milik sendiri) agar IP yang terlihat adalah IP residential/non-datacenter.
#
# === SETUP TAILSCALE EXIT NODE ===
# 1. Di mesin exit node (komputer/VPS kamu), jalankan:
#      sudo tailscale up --advertise-exit-node
# 2. Di Tailscale Admin Console (https://login.tailscale.com/admin/machines),
#    klik mesin -> Edit route settings -> aktifkan "Use as exit node"
# 3. Buat OAuth Client: https://login.tailscale.com/admin/settings/oauth
#    -> Generate OAuth client -> Scopes: "Auth keys (write)" + "Devices (Write)" -> Add tag: "tag:crawler"
#    (tanpa scope "Auth keys", `tailscale up` gagal dengan 404 "not found")
# 4. Di repo GitHub -> Settings -> Secrets -> New repository secrets:
#      TAILSCALE_OAUTH_CLIENT_ID (Client ID)
#      TAILSCALE_OAUTH_SECRET    (Client Secret)
# 5. Di repo GitHub -> Settings -> Variables -> New repository variable:
#      TAILSCALE_EXIT_NODE | Nilai: hostname (redmi-9) atau IP Tailscale (100.x.x.x) mesin kamu
#
# Cron pakai UTC: 23:13 UTC = 06:13 WIB, 04:07 UTC = 11:07 WIB.
# Schedule GitHub telat 4-9 jam (terbukti 1-6 Okt: 16:07 WIB baru jalan 21:00-01:18),
# jadi jam 16 dimajukan ke 11:07 agar hasilnya jatuh sore, bukan larut malam.
name: Crawl LPSE

on:
  schedule:
    - cron: '13 23 * * *' # 06:13 WIB
    - cron: '7 4 * * *'   # 11:07 WIB (dulu 16:07, dimajukan - lihat catatan delay di atas)
  workflow_dispatch: {}

# Satu run saja - trigger saat sedang jalan otomatis membatalkan run lama (latest wins)
concurrency:
  group: crawl-lpse
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ${{ vars.CRAWLER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      EXIT_NODE: ${{ vars.TAILSCALE_EXIT_NODE || secrets.TAILSCALE_EXIT_NODE }}
    steps:
      - uses: actions/checkout@v5

      # Fail cepat sebelum install browser (~5 menit) kalau exit node belum dikonfigurasi.
      - name: Validasi konfigurasi exit node
        if: runner.os == 'Linux'
        run: |
          TRIMMED="$(echo "${EXIT_NODE:-}" | xargs)"
          if [ -z "$TRIMMED" ]; then
            echo "::error::TAILSCALE_EXIT_NODE kosong - isi di Settings > Secrets and variables > Actions > Variables (lihat header file ini). Tanpa exit node, traffic keluar dari IP datacenter GitHub dan kena blokir Cloudflare."
            exit 1
          fi
          echo "EXIT_NODE=$TRIMMED" >> "$GITHUB_ENV"
          # IP sebelum Tailscale tersambung - pembanding untuk step Verify.
          BASELINE_IP=$(curl -s --max-time 10 https://api.ipify.org || true)
          echo "BASELINE_IP=$BASELINE_IP" >> "$GITHUB_ENV"
          echo "Exit node: $TRIMMED | baseline IP: ${BASELINE_IP:-?}"

      # Diagnosis langsung ke API Tailscale - `tailscale up` cuma bilang 404 "not found"
      # yang ambigu (bisa salah scope / salah tag / kredensial mati). Step ini menyebutkan
      # HTTP code + body persis sebelum action-nya jalan.
      - name: Diagnose OAuth client
        if: runner.os == 'Linux'
        env:
          OID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          OSEC: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          TOKEN=$(curl -s --max-time 15 -X POST https://api.tailscale.com/api/v2/oauth/token \
            -d "client_id=$OID" -d "client_secret=$OSEC" -d "grant_type=client_credentials")
          ACCESS=$(echo "$TOKEN" | jq -r '.access_token // empty')
          if [ -z "$ACCESS" ]; then
            echo "::error::OAuth token gagal (client ID/secret salah atau client dihapus): $TOKEN"
            exit 1
          fi
          RES=$(curl -s --max-time 15 -w '\n%{http_code}' -X POST https://api.tailscale.com/api/v2/tailnet/-/keys \
            -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:crawler"]}}},"expirySeconds":3600}')
          CODE=$(echo "$RES" | tail -n1)
          BODY=$(echo "$RES" | sed '$d')
          if [ "$CODE" != "200" ]; then
            echo "::error::POST /keys = HTTP $CODE: $BODY | 404 = OAuth client BELUM punya scope 'Auth keys (write)'; 400 'tags ... not permitted' = tag:crawler belum di-ownership client ini. Fix: Admin Console -> OAuth client -> Edit (ellipsis) -> tambah scope + tag:crawler."
            exit 1
          fi
          echo "OAuth client OK: token + auth key (tag:crawler) berhasil."

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Install Chromium (macOS)
        if: runner.os == 'macOS'
        working-directory: backend
        run: npx playwright install chromium

      # Chrome asli dipakai channel:'chrome' agar sec-ch-ua tidak bocor "HeadlessChrome".
      - name: Install Google Chrome (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: backend
        run: npx playwright install --with-deps chrome

      # Challenge Cloudflare "Just a moment..." jarang lolos di mode headless -
      # jalankan Chrome non-headless lewat Xvfb (Linux saja).
      - name: Install Xvfb (browser non-headless)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      # Camoufox: Firefox-based stealth browser (80-90% bypass Cloudflare dari datacenter IP)
      - name: Install Camoufox
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          pip3 install camoufox --break-system-packages --quiet
          python3 -m camoufox fetch


      # Tailscale: route semua traffic keluar lewat exit node (IP residential/VPS) agar lolos Cloudflare.
      # Dua fase: (1) connect tanpa --exit-node dulu - saat login peer list masih kosong,
      # (2) set exit node di step berikutnya setelah netmap tersinkron.
      - name: Connect Tailscale Exit Node
        if: runner.os == 'Linux' && env.EXIT_NODE != ''
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:crawler
          args: --accept-routes

      - name: Aktifkan exit node
        if: runner.os == 'Linux' && env.EXIT_NODE != ''
        run: |
          OUT=""
          for i in $(seq 1 12); do
            if OUT=$(sudo -E tailscale set --exit-node="$EXIT_NODE" --exit-node-allow-lan-access=true 2>&1); then
              echo "Exit node aktif: $EXIT_NODE"
              exit 0
            fi
            echo "Percobaan $i/12: $OUT"
            sleep 5
          done
          echo "::error::Gagal set exit node '$EXIT_NODE': $OUT. Cek: (1) nilai TAILSCALE_EXIT_NODE = IP atau hostname exit node, (2) mesin exit node sudah di-approve 'Use as exit node' di Admin Console."
          exit 1

      # DNS lewat exit node kadang timeout (router ISP forwarding DNS mati saat
      # reconnect) -> EAI_AGAIN. Paksa resolver publik, query-nya tetap keluar
      # lewat exit node karena semua traffic sudah di-route Tailscale.
      - name: Set DNS publik (hindari EAI_AGAIN)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          IFACE=$(ip route show default | awk '{print $5; exit}')
          echo "iface=$IFACE"
          sudo resolvectl dns "$IFACE" 1.1.1.1 8.8.8.8 || true
          sudo resolvectl domain "$IFACE" '~.' || true
          resolvectl status "$IFACE" | grep -i dns || true

      - name: Verify public IP (pastikan pakai IP exit node, bukan IP GitHub)
        if: runner.os == 'Linux'
        run: |
          if [ -z "$EXIT_NODE" ]; then
            echo "::error::TAILSCALE_EXIT_NODE kosong - isi di Settings > Secrets and variables > Actions > Variables (lihat header file ini). Tanpa exit node, traffic keluar dari IP datacenter GitHub dan kena blokir Cloudflare."
            exit 1
          fi
          ONLINE=$(sudo -E tailscale status --json 2>/dev/null | jq -r '.ExitNodeStatus.Online // false')
          if [ "$ONLINE" != "true" ]; then
            echo "::error::Exit node '$EXIT_NODE' offline / Tailscale tidak tersambung (tailscale status). Cek log step 'Connect Tailscale Exit Node' - kemungkinan OAuth client kehilangan scope 'Auth keys'."
            exit 1
          fi
          IP=$(curl -s --max-time 15 https://api.ipify.org || curl -s --max-time 15 https://ifconfig.me || curl -s --max-time 15 https://icanhazip.com)
          IP=$(echo "$IP" | xargs)
          if [ -z "$IP" ]; then
            echo "::error::Tidak bisa fetch IP publik (ipify/ifconfig/icanhazip gagal semua) - jaringan runner bermasalah."
            exit 1
          fi
          ORG=$(curl -s --max-time 15 https://ipinfo.io/org)
          echo "IP publik runner: $IP ($ORG)"
          if [ -n "$BASELINE_IP" ] && [ "$IP" = "$BASELINE_IP" ]; then
            echo "::error::IP publik sama dengan baseline GitHub ($IP) - traffic TIDAK lewat exit node '$EXIT_NODE'."
            exit 1
          fi
          if echo "$ORG" | grep -qiE 'microsoft|azure|amazon|google'; then
            echo "::error::Exit node Tailscale tidak aktif ($EXIT_NODE) - traffic masih keluar dari IP datacenter $ORG. Cek: (1) nilai TAILSCALE_EXIT_NODE harus IP/hostname exit node, (2) mesin exit node sudah di-approve 'Use as exit node' di Admin Console."
            exit 1
          fi

      # FlareSolverr: solver Cloudflare (berjalan lokal, pakai IP exit node via Tailscale)
      # Batasi 5 menit: docker pull bisa gantung 1 jam lewat exit node → keburu timeout job
      # dan crawl tak jalan. Tanpa FlareSolverr crawler fallback HTTP/Playwright.
      - name: Start FlareSolverr
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          docker run -d \
            --name=flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest

          echo "Waiting for FlareSolverr to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/ > /dev/null 2>&1; then
              echo "FlareSolverr ready on http://localhost:8191"
              break
            fi
            sleep 1
          done


      - name: Crawl LPSE
        working-directory: backend
        run: |
          if command -v xvfb-run > /dev/null 2>&1; then
            xvfb-run -a node scripts/crawl-now.js
          else
            node scripts/crawl-now.js
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLARESOLVERR_URL: http://localhost:8191/v1
