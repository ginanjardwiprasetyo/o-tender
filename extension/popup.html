<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 250px; font-family: 'Inter', sans-serif; padding: 15px; margin: 0; background: #0f172a; color: #f8fafc; }
    h3 { margin: 0 0 10px 0; font-size: 14px; color: #38bdf8; }
    .status { margin-bottom: 15px; font-size: 13px; color: #94a3b8; }
    .status span { font-weight: bold; }
    .btn { display: block; width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; color: white; margin-bottom: 8px; }
    .btn-start { background: #3b82f6; }
    .btn-start:hover { background: #2563eb; }
    .btn-stop { background: #ef4444; }
    .btn-stop:hover { background: #dc2626; }
  </style>
</head>
<body>
  <h3>TenderBuild Scraper</h3>
  <div class="status">Status: <span id="statusText">Menunggu...</span></div>
  <button id="btnStart" class="btn btn-start">Start Polling</button>
  <button id="btnStop" class="btn btn-stop" style="display:none;">Stop Polling</button>
  <script src="popup.js"></script>
</body>
</html>
